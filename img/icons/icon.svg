<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- App icon: a night sky over the dunes, the crescent, and the route from Makkah (bottom) to Al-Madinah (top).
       tools/build-images.js renders the PNG icons from this file and from maskable.svg. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1426"/>
      <stop offset="0.65" stop-color="#1b2a48"/>
      <stop offset="1" stop-color="#3a3350"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b77c"/>
      <stop offset="1" stop-color="#a87f45"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <g fill="#f4ecd6">
      <circle cx="96" cy="92" r="4"/><circle cx="170" cy="58" r="2.6"/><circle cx="64" cy="190" r="2.6"/>
      <circle cx="236" cy="120" r="3"/><circle cx="430" cy="236" r="2.6"/><circle cx="140" cy="250" r="2"/>
    </g>
    <path d="M396 74a78 78 0 1 0 0 148a62 62 0 1 1 0-148z" fill="#e9cf8f"/>
    <path d="M0 400 C120 352 210 386 300 366 C390 346 450 372 512 352 L512 512 L0 512Z" fill="url(#sand)"/>
    <path d="M0 452 C140 418 280 456 512 420 L512 512 L0 512Z" fill="#8c6a3b" opacity="0.55"/>
    <path d="M140 420 C150 360 250 350 262 300 C276 240 200 220 236 160" fill="none" stroke="#f4ecd6" stroke-width="11" stroke-linecap="round" stroke-dasharray="1 26"/>
    <circle cx="140" cy="420" r="17" fill="#0f6b55" stroke="#f4ecd6" stroke-width="7"/>
    <circle cx="236" cy="160" r="17" fill="#0f6b55" stroke="#f4ecd6" stroke-width="7"/>
  </g>
</svg>
